spring.application.name=fpllab

fpl.base-url=https://fantasy.premierleague.com/api

# Live league table. Get a free key at https://www.football-data.org/client/register
# and set it as the FOOTBALL_DATA_API_KEY environment variable (never commit it).
# Without a key, the table is calculated from FPL fixture results instead.
football-data.base-url=https://api.football-data.org/v4
football-data.api-key=${FOOTBALL_DATA_API_KEY:}
football-data.competition=PL

# Defaults for local development; Docker overrides them with environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fpllab}
spring.datasource.username=${DB_USER:fpllab_user}
spring.datasource.password=${DB_PASSWORD:fpllab_pass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# FPL -> database sync (runs on startup and on this schedule)
fpl.sync.on-startup=true
fpl.sync.cron=0 */30 * * * *

# Show error reasons (e.g. "FPL team not found") in API error responses
server.error.include-message=always
