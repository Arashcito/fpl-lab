spring.application.name=fpllab

# Render (and most hosts) tell the app which port to use
server.port=${PORT:8080}

fpl.base-url=https://fantasy.premierleague.com/api

# Live league table. Get a free key at https://www.football-data.org/client/register
# and set it as the FOOTBALL_DATA_API_KEY environment variable (never commit it).
# Without a key, the table is calculated from FPL fixture results instead.
football-data.base-url=https://api.football-data.org/v4
football-data.api-key=${FOOTBALL_DATA_API_KEY:}
football-data.competition=PL

# Defaults for local development; Docker overrides them with environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fpllab?reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:fpllab_user}
spring.datasource.password=${DB_PASSWORD:fpllab_pass}

# Small pool: the free Neon database and 512 MB server don't need more
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# FPL -> database sync (runs on startup and on this schedule)
fpl.sync.on-startup=true
fpl.sync.cron=0 */30 * * * *
# Online: set SYNC_TOKEN so only your scheduler can call POST /api/sync
fpl.sync.token=${SYNC_TOKEN:}

# Compress responses (JSON shrinks ~90%) and let browsers reuse CSS/JS/images for 10 minutes
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/javascript,image/svg+xml
server.compression.min-response-size=1024
spring.web.resources.cache.cachecontrol.max-age=10m

# Show error reasons (e.g. "FPL team not found") in API error responses
server.error.include-message=always
