spring.application.name=fpllab

fpl.base-url=https://fantasy.premierleague.com/api

# Live league table. Get a free key at https://www.football-data.org/client/register
# and set it as the FOOTBALL_DATA_API_KEY environment variable (never commit it).
# Without a key, the table is calculated from FPL fixture results instead.
football-data.base-url=https://api.football-data.org/v4
football-data.api-key=${FOOTBALL_DATA_API_KEY:}
football-data.competition=PL

spring.datasource.url=jdbc:postgresql://localhost:5432/fpllab
spring.datasource.username=fpllab_user
spring.datasource.password=fpllab_pass

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
