<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the best FPL players by expected points, price and position.">
    <meta name="theme-color" content="#1E7B3E"><title>Top Picks · FPL Lab</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script>
</head>
<body><div class="app-shell"><div data-site-header data-page="picks"></div>
    <main class="page-main">
        <section class="page-intro">
            <div><span class="eyebrow">Scouting report</span><h1>Find your next difference-maker.</h1><p>Expected points for every player across the coming fixtures. Select a player to see where the points come from.</p></div>
            
        </section>
        <section class="panel filter-panel">
            <form id="picks-form" class="filter-form">
                <label><span>Position</span><select id="position"><option value="">All positions</option><option value="GKP">Goalkeepers</option><option value="DEF">Defenders</option><option value="MID">Midfielders</option><option value="FWD">Forwards</option></select></label>
                <label><span>Plan ahead</span><select id="horizon"><option value="1">1 gameweek</option><option value="3" selected>3 gameweeks</option><option value="5">5 gameweeks</option></select></label>
                <label><span>Maximum price</span><div class="input-prefix"><span>£</span><input id="max-price" type="number" step="0.1" min="3.5" placeholder="Any"></div></label>
                <button class="button button-secondary" type="submit">Update picks</button>
            </form>
        </section>
        <section class="data-section"><div class="section-heading"><div><span class="eyebrow">Ranked by expected points</span><h2>Top players</h2></div><p class="hint">Select a row for the full breakdown.</p></div><div id="picks" aria-live="polite"></div></section>
    </main><div data-site-footer></div>
</div>
<script src="js/layout.js"></script><script src="js/ui.js"></script><script src="js/api.js"></script><script src="js/projections.js"></script><script src="js/picks.js"></script>
</body></html>
