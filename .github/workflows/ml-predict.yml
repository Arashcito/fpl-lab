# Predicts every player's points for the next 3 gameweeks and stores them in the
# Neon database (table ml_predictions), where the app picks them up.
# Needs the repository secret DATABASE_URL_UNPOOLED (Settings -> Secrets and variables -> Actions).
name: ML predictions

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:          # "Run workflow" button

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - name: Predict next gameweeks
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: python -m fpl_ml.predict
